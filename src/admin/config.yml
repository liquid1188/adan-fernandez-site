      - name: url
        label: Link
        widget: string
      - name: icon
        label: Icon
        widget: select
        options:
        - youtube
        - instagram
        - facebook
        - soundcloud
        - linkedin
    - name: cv
      label: CV path
      widget: string
    - name: photoCredit
      label: Photo credit line
      widget: string
    - name: instagram
      label: Instagram profile link
      widget: string
    - name: beholdFeedId
      label: Behold feed ID (Instagram feed)
      widget: string
      required: false
      hint: 'From behold.so: open the feed, click Embed code, and copy only the feed-id value. Leave empty to show just the Follow on Instagram button.'

    - name: roles
      label: Roles line
      widget: string
    - name: url
      label: Site address
      widget: string
    - name: email
      label: Email
      widget: string
    - name: phone
      label: Phone (as displayed)
      widget: string
    - name: phoneHref
      label: Phone (dialable, +1…)
      widget: string
    - name: youtube
      label: YouTube channel
      widget: string
    - name: management
      label: Management
      widget: object
      fields:
      - name: name
        label: Name
        widget: string
      - name: url
        label: Link
        widget: string
      - name: contact
        label: Contact person
        widget: string
        required: false
      - name: email
        label: Contact email
        widget: string

      label: Line under the heading
      widget: text
    - name: items
      label: Photos
      widget: list
      summary: '{{fields.alt}}'
      hint: Drag to reorder. Photos show whole, in the order listed.
      fields:
      - name: src
        label: Photo
        widget: image
      - name: alt
        label: Caption
        widget: string
      - name: w
        label: Width in pixels
        widget: number
        value_type: int
        hint: Helps the page lay out before the photo loads. A rough number is fine.
      - name: h
        label: Height in pixels
        widget: number
        value_type: int

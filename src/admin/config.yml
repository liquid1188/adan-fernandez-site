    - name: technical
      label: Technical requirements
      widget: text
    - name: onesheet
      label: One-sheet PDF
      widget: file
      hint: The printable one-page PDF presenters download.
    - name: press
      label: Press coverage
      widget: list
      summary: '{{fields.year}} · {{fields.where}}'
      fields:
      - name: year
        label: Year
        widget: string
      - name: title
        label: Headline
        widget: string
      - name: where
        label: Publication
        widget: string
      - name: link
        label: Link (optional)
        widget: string
        required: false
  - name: photos
    label: Press photos
    file: src/_data/photos.json
    fields:
    - name: credit
      label: Photo credit line
      widget: string
    - name: items
      label: Photos
      widget: list
      summary: '{{fields.alt}}'
      fields:
      - name: file
        label: Full-size photo (download)
        widget: image
      - name: web
        label: Smaller copy shown on the page
        widget: image
      - name: alt
        label: Caption
        widget: string
      - name: w
        label: Full-size width in pixels
        widget: number

    fields:
    - name: intro
      label: Introduction
      widget: text
    - name: areas
      label: What he teaches
      label_singular: Area
      widget: list
      summary: '{{fields.title}}  ·  {{fields.place}}'
      fields:
      - name: title
        label: Title
        widget: string
      - name: place
        label: Institution
        widget: string
      - name: body
        label: Description
        widget: text
    - name: offers
      label: Masterclasses and residencies
      label_singular: Offering
      widget: list
      field:
        name: item
        label: Offering
        widget: string
    - name: courses
      label: Courses he has taught
      widget: list
      field:
        name: course
        label: Course
        widget: string
- name: presskit
  label: Press kit
  files:
  - name: presskit
    label: Press kit text
    file: src/_data/presskit.json
    fields:
    - name: pronunciation
      label: How to say his name
      widget: string
    - name: glance
      label: At a glance
      widget: list
      summary: '{{fields.k}}'
      fields:
      - name: k
        label: Label
        widget: string
      - name: v
        label: Text
        widget: text
    - name: programs
      label: Recital programs
      widget: list
      summary: '{{fields.title}}'
      fields:
      - name: title
        label: Program title
        widget: string
      - name: desc
        label: Description
        widget: text
    - name: topics
      label: Lecture topics
      widget: list
      field:
        name: topic
        label: Topic
        widget: string
    - name: venues
      label: Venues and ensembles
      widget: text
    - name: media
      label: Media appearances
      widget: list
      field:
        name: item
        label: Appearance
        widget: string
    - name: honors
      label: Honors
      widget: list
      summary: '{{fields.year}} · {{fields.text}}'
      fields:
      - name: year
        label: Year
        widget: string
      - name: text
        label: Description
